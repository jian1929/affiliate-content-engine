        // Load syndicated state from localStorage
        function getSyndicated() {
            const stored = localStorage.getItem('syndicatedArticles');
            return stored ? JSON.parse(stored) : {};
        }

        function saveSyndicated(syndicated) {
            localStorage.setItem('syndicatedArticles', JSON.stringify(syndicated));
        }

        function markSyndicated(slug, platform) {
            const syndicated = getSyndicated();
            if (!syndicated[slug]) syndicated[slug] = [];
            if (!syndicated[slug].includes(platform)) {
                syndicated[slug].push(platform);
            }
            saveSyndicated(syndicated);
            renderArticles();
            updateStats();
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function copyToClipboard(text, label) {
            navigator.clipboard.writeText(text).then(() => {
                showToast(`${label} copied!`);
            });
        }

        function generateTwitterThread(article) {
            const thread = `🧵 ${article.title}

Here's what every Amazon seller needs to know in 2026:

${article.summary}

${article.tags.map(t => '#' + t.replace('-', '')).join(' ')}

#AmazonSellers #Ecommerce

👇 Drop your questions below 👇`;
            return thread;
        }

        function generateRedditPost(article) {
            return `**${article.title}**

${article.summary}

**Key Topics Covered:**
${article.tags.map(t => `- #${t.replace('-', '')}`).join('\n')}

Source: ${SITE_URL}/blog/${article.slug}.html

---

*What challenges are you facing with Amazon selling?*`;
        }

        function generateLinkedInPost(article) {
            return `🎯 ${article.title}

As Amazon sellers, we all face the same challenges: competition, pricing pressure, and staying profitable.

${article.summary}

What strategies have worked best for your Amazon business?

👇 Comment below - I'd love to hear your thoughts!

#AmazonSellers #Ecommerce #FBA #AmazonFBA`;
        }

        function openDevto(article) {
            const url = `https://dev.to/new/story`;
            markSyndicated(article.slug, 'devto');
            window.open(url, '_blank');
            setTimeout(() => {
                const content = `Title: ${article.title}

Tags: ${article.tags.join(', ')}

${article.summary}

Read the full guide: ${SITE_URL}/blog/${article.slug}.html`;
                copyToClipboard(content, 'Dev.to content');
            }, 500);
        }

        function openMedium(article) {
            const url = `https://medium.com/new/story`;
            markSyndicated(article.slug, 'medium');
            window.open(url, '_blank');
            setTimeout(() => {
                const content = `${article.title}

${article.summary}

${article.tags.join(' ')}`;
                copyToClipboard(content, 'Medium content');
            }, 500);
        }

        function openHashnode(article) {
            const url = `https://hashnode.com/new/story`;
            markSyndicated(article.slug, 'hashnode');
            window.open(url, '_blank');
            setTimeout(() => {
                const content = `Title: ${article.title}

Tags: ${article.tags.join(', ')}

${article.summary}

Read more: ${SITE_URL}/blog/${article.slug}.html`;
                copyToClipboard(content, 'Hashnode content');
            }, 500);
        }

        function copyTwitter(article) {
            markSyndicated(article.slug, 'twitter');
            copyToClipboard(generateTwitterThread(article), 'Twitter thread');
        }

        function copyReddit(article) {
            markSyndicated(article.slug, 'reddit');
            copyToClipboard(generateRedditPost(article), 'Reddit post');
        }

        function copyLinkedIn(article) {
            markSyndicated(article.slug, 'linkedin');
            copyToClipboard(generateLinkedInPost(article), 'LinkedIn post');
        }

        function syndicateAll(platform) {
            const allText = articles.map(a => {
                switch(platform) {
                    case 'twitter': return generateTwitterThread(a);
                    case 'reddit': return generateRedditPost(a);
                    case 'linkedin': return generateLinkedInPost(a);
                    default: return `${a.title}\n${SITE_URL}/blog/${a.slug}.html`;
                }
            }).join('\n\n---\n\n');

            copyToClipboard(allText, `All ${platform} posts`);
            articles.forEach(a => markSyndicated(a.slug, platform));
        }

        function renderArticles(filter = 'all') {
            const container = document.getElementById('articlesContainer');
            const syndicated = getSyndicated();
            const filtered = articles.filter(a => {
                if (filter === 'all') return true;
                const isSyndicated = syndicated[a.slug] && syndicated[a.slug].length > 0;
                return filter === 'syndicated' ? isSyndicated : !isSyndicated;
            });

            container.innerHTML = filtered.map(article => {
                const isSyndicated = syndicated[article.slug] && syndicated[article.slug].length > 0;
                const platforms = syndicated[article.slug] || [];
                return `
                    <div class="article-card ${isSyndicated ? 'syndicated' : ''}">
                        <div class="article-header">
                            <div class="article-title">${article.title}</div>
                            ${isSyndicated ? '<span class="syndicated-badge">✓</span>' : ''}
                        </div>
                        <div class="article-tags">
                            ${article.tags.map(t => `<span class="tag">${t}</span>`).join('')}
                        </div>
                        <div class="article-actions">
                            <button class="action-btn devto" onclick="openDevto(articles.find(a => a.slug === '${article.slug}'))">Dev.to</button>
                            <button class="action-btn medium" onclick="openMedium(articles.find(a => a.slug === '${article.slug}'))">Medium</button>
                            <button class="action-btn hashnode" onclick="openHashnode(articles.find(a => a.slug === '${article.slug}'))">Hashnode</button>
                            <button class="action-btn twitter" onclick="copyTwitter(articles.find(a => a.slug === '${article.slug}'))">Twitter</button>
                            <button class="action-btn reddit" onclick="copyReddit(articles.find(a => a.slug === '${article.slug}'))">Reddit</button>
                            <button class="action-btn linkedin" onclick="copyLinkedIn(articles.find(a => a.slug === '${article.slug}'))">LinkedIn</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateStats() {
            const syndicated = getSyndicated();
            const syndicatedCount = Object.keys(syndicated).length;
            const total = articles.length;
            const percent = Math.round((syndicatedCount / total) * 100);
            const potentialViews = syndicatedCount * 500; // Estimate 500 views per syndicated article

            document.getElementById('syndicatedCount').textContent = syndicatedCount;
            document.getElementById('progressPercent').textContent = percent;
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('potentialViews').textContent = potentialViews.toLocaleString();
        }

        // Filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderArticles(btn.dataset.filter);
            });
        });

        // Initial render
        renderArticles();
        updateStats();
    </script>
